plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  Exclude:
    - spec/fixtures/**/*
    - pkg/**/*

Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - '*.gemspec'

Metrics/MethodLength:
  Max: 20

Layout/LineLength:
  Max: 150

Naming/FileName:
  Exclude:
    - lib/jekyll-md.rb

Style/Documentation:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - spec/integration_spec.rb

RSpec/MultipleExpectations:
  Max: 6

RSpec/ExampleLength:
  Max: 10
